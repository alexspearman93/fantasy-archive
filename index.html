<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121411"><title>The Fantasy Archive</title><style>
:root{--bg:#111410;--panel:#1b201b;--panel2:#222820;--line:#3b4135;--gold:#c7a66b;--cream:#e9e0ca;--muted:#a7aa99;--red:#a66c5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:Georgia,'Times New Roman',serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.shell{display:grid;grid-template-columns:260px 1fr;min-height:100dvh}.side{border-right:1px solid var(--line);background:#171b16;padding:28px 17px;display:flex;flex-direction:column;gap:10px}.mark{text-align:center;color:var(--gold);font-size:28px;letter-spacing:6px}.brand{text-align:center;font-size:22px;letter-spacing:2px;margin:8px 0 3px}.tag{text-align:center;color:var(--muted);font:11px system-ui;letter-spacing:2px;text-transform:uppercase;margin-bottom:28px}.nav{display:flex;align-items:center;gap:13px;border:1px solid transparent;background:transparent;color:var(--muted);padding:14px 15px;text-align:left;border-radius:7px;width:100%;font-size:15px}.nav.active{border-color:#5e533c;color:var(--gold);background:#2b2a21}.nav:hover{background:#292d25;color:var(--cream)}.glyph{font-size:19px;width:24px;text-align:center}.foot{margin-top:auto;color:var(--muted);font:11px system-ui;line-height:1.6;padding:14px;border-top:1px solid var(--line)}.main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 32px;border-bottom:1px solid var(--line);gap:12px}.eyebrow{font:11px system-ui;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}.top h1{font-size:29px;font-weight:normal;margin:6px 0 0}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#2c3027;color:var(--cream);border:1px solid #565b4b;border-radius:6px;padding:10px 13px;font-size:13px}.btn.primary{background:#a88a54;border-color:#c4a66c;color:#151713;font-weight:bold}.btn.danger{border-color:#754f45;color:#e7b2a6}.btn:hover{filter:brightness(1.17)}.content{padding:28px 32px;max-width:1350px;margin:auto}.intro{color:var(--muted);line-height:1.6;margin:0 0 23px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}.listpane,.editor{background:var(--panel);border:1px solid var(--line);border-radius:9px;min-width:0}.listpane{padding:13px;align-self:start}.pane-head{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 14px;color:var(--gold);font-size:13px;letter-spacing:1px;text-transform:uppercase}.item{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:5px;padding:13px 11px;color:var(--cream);background:transparent;margin-bottom:5px}.item small{display:block;color:var(--muted);font:11px system-ui;margin-top:6px}.item.selected{border-color:#5a5039;background:#302f25}.editor{padding:28px;min-height:440px}.field{margin:0 0 20px}.field label{display:block;color:var(--gold);font:11px system-ui;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:9px}.field input,.field textarea,.field select{width:100%;background:#131712;border:1px solid #41493d;border-radius:5px;color:var(--cream);padding:13px;resize:vertical}.field input{font-size:18px}.field textarea{min-height:110px;line-height:1.7}.field textarea.prose{min-height:400px;font-size:17px;line-height:1.85}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.editorhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:22px}.editorhead h2{font-size:23px;font-weight:normal;margin:0}.status{font:12px system-ui;color:var(--muted)}.ornament{color:var(--gold);text-align:center;letter-spacing:12px;margin:10px 0 25px}.empty{color:var(--muted);line-height:1.7;padding:40px 10px;text-align:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.mobilebar{display:none}.notice{padding:12px 14px;border:1px solid #60543b;background:#28291f;border-radius:6px;font:12px/1.5 system-ui;color:#d9c59b;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px;margin-bottom:24px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px}.stat b{display:block;font-size:30px;color:var(--gold);font-weight:normal}.stat span{font:12px system-ui;color:var(--muted)}.hero{background:radial-gradient(circle at 90% 0%,#3c3524,transparent 55%),var(--panel);border:1px solid #65573d;border-radius:9px;padding:36px;margin-bottom:22px}.hero h2{font-size:34px;font-weight:normal;margin:10px 0}.hero p{color:var(--muted);line-height:1.7;max-width:650px}.hint{color:var(--muted);font:12px/1.6 system-ui}.toast{position:fixed;bottom:18px;right:18px;background:#38432e;border:1px solid var(--gold);padding:12px 16px;border-radius:7px;font:13px system-ui;display:none;z-index:9}.toast.show{display:block}@media(max-width:850px){.shell{display:block;padding-bottom:69px}.side{display:none}.mobilebar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:5;background:#171b16;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.mobilebar button{background:transparent;border:0;color:var(--muted);padding:10px 2px 8px;font:10px system-ui}.mobilebar button.active{color:var(--gold)}.mobilebar span{display:block;font-size:19px;margin-bottom:4px}.top{padding:18px}.top h1{font-size:23px}.content{padding:18px}.layout{grid-template-columns:1fr}.listpane{display:flex;overflow-x:auto;gap:6px;align-items:center;padding:9px}.pane-head{flex-shrink:0;padding:8px}.item{min-width:145px;margin:0}.editor{padding:18px;min-height:360px}.split{grid-template-columns:1fr}.hero{padding:24px}.hero h2{font-size:27px}.top-actions .btn{padding:8px;font-size:11px}}
</style><style>
/* Archive enhancement v0.2 */
.archive-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
.archive-search{background:#131712;border:1px solid #555a48;border-radius:6px;color:#e9e0ca;padding:11px 13px;min-width:160px;flex:1;font:14px system-ui}
.archive-search:focus{outline:2px solid #c7a66b}

body.archive-focus .side,body.archive-focus .mobilebar,body.archive-focus .listpane,body.archive-focus .intro,body.archive-focus .top-actions{display:none!important}
body.archive-focus .shell{display:block;padding-bottom:0}

</style></head><body><div class="shell"><aside class="side"><div class="mark">✦</div><div class="brand">THE FANTASY<br>ARCHIVE</div><div class="tag">A writer's sanctuary</div><div id="desktopnav"></div><div class="foot">✧ Local prototype<br>Your edits are saved on this device. Export backups regularly. Live collaboration is not connected yet.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">✦ &nbsp; The Scriptorium</div><h1 id="pageTitle">The Library</h1></div><div class="top-actions"><button class="btn" id="exportBtn">⇩ Export</button><button class="btn" id="importBtn">⇧ Import</button><input id="fileInput" type="file" accept="application/json,.json" hidden></div></header><div id="content" class="content"></div></main></div><nav id="mobilenav" class="mobilebar"></nav><div class="toast" id="toast"></div><script>
(()=>{'use strict';const KEY='fantasy-archive-v1';const tabs=[['home','⌂','Library'],['chapters','✒','Manuscripts'],['characters','♙','Characters'],['locations','◇','Locations'],['lore','✧','Lore']];const seed={project:'The Unwritten Realm',chapters:[{id:'chapter1',title:'Chapter One — The Arrival',body:'The old road disappeared beneath the mist.\n\nBeyond the last standing stone, a bell rang once in the darkness.'}],characters:[{id:'char1',name:'The Wanderer',role:'Protagonist',description:'A traveler with a past they refuse to discuss.',personality:'Observant, stubborn, quietly compassionate.',motivation:'Discover what lies beyond the forgotten road.',relationships:'',notes:''}],locations:[{id:'loc1',name:'The Forgotten Road',region:'The Northern Marches',description:'An ancient road swallowed by fog and wild growth.',history:'No map records who built it.',connections:'The Wanderer',notes:''}],lore:[{id:'lore1',name:'The First Bell',category:'Legends',summary:'A bell heard only when someone crosses into the unknown.',details:'Its origin is disputed. Some say it is a warning; others call it a welcome.',connections:'The Forgotten Road',notes:''}]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=structuredClone(seed)}for(const k of ['chapters','characters','locations','lore'])if(!Array.isArray(db[k]))db[k]=[];let tab='home',selected={chapters:db.chapters[0]?.id,characters:db.characters[0]?.id,locations:db.locations[0]?.id,lore:db.lore[0]?.id};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('Storage unavailable. Export a backup.')}};function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}const countWords=s=>(s.trim().match(/\S+/g)||[]).length;function nav(){const html=tabs.map(([id,ic,label])=>`<button class="nav ${tab===id?'active':''}" data-tab="${id}"><span class="glyph">${ic}</span>${label}</button>`).join('');$('desktopnav').innerHTML=html;$('mobilenav').innerHTML=tabs.map(([id,ic,label])=>`<button class="${tab===id?'active':''}" data-tab="${id}"><span>${ic}</span>${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}function field(key,label,val,type='text'){return `<div class="field"><label for="f_${key}">${label}</label>${type==='textarea'||type==='prose'?`<textarea id="f_${key}" class="${type==='prose'?'prose':''}" data-field="${key}" placeholder="Begin writing...">${esc(val)}</textarea>`:`<input id="f_${key}" data-field="${key}" value="${esc(val)}">`}</div>`}const schemas={chapters:[['title','Chapter title','text'],['body','Manuscript','prose']],characters:[['name','Name','text'],['role','Role / title','text'],['description','Background','textarea'],['personality','Personality and traits','textarea'],['motivation','Motivations','textarea'],['relationships','Relationships','textarea'],['notes','Additional notes','textarea']],locations:[['name','Location name','text'],['region','Region / realm','text'],['description','Description','textarea'],['history','History','textarea'],['connections','Connected characters / places','textarea'],['notes','Additional notes','textarea']],lore:[['name','Entry title','text'],['category','Category (magic, history, factions...)','text'],['summary','Summary','textarea'],['details','Full lore entry','prose'],['connections','Related entries','textarea'],['notes','Additional notes','textarea']]};function labelFor(x){return x.title||x.name||'Untitled'}function renderHome(){const words=db.chapters.reduce((n,c)=>n+countWords(c.body||''),0);$('content').innerHTML=`<section class="hero"><div class="eyebrow">✦ &nbsp; Welcome to your sanctuary</div><h2>${esc(db.project)}</h2><p>Every legend begins somewhere. Build your world, shape its people, and give its stories a place to live.</p><div class="actions"><button class="btn primary" id="startWriting">Continue writing ✒</button><button class="btn" id="renameProject">Rename archive</button></div></section><div class="cards">${[['chapters','Chapters'],['characters','Characters'],['locations','Locations'],['lore','Lore entries']].map(([k,l])=>`<div class="stat"><b>${db[k].length}</b><span>${l}</span></div>`).join('')}<div class="stat"><b>${words.toLocaleString()}</b><span>Words written</span></div></div><div class="notice">This is a single-device prototype. Export your archive as a JSON backup or send that file to another device to transfer a snapshot. Importing replaces the current archive; simultaneous editing is not available yet.</div><p class="hint">Your writing is automatically saved in this browser. Private browsing, clearing site data, or opening the file in a different browser can result in a separate archive.</p>`;$('startWriting').onclick=()=>{tab='chapters';render()};$('renameProject').onclick=()=>{const n=prompt('Archive name:',db.project);if(n?.trim()){db.project=n.trim();save();render()}}}function newItem(k){const id='id'+Date.now()+Math.random().toString(36).slice(2,7);const obj={id};schemas[k].forEach(([key])=>obj[key]='');obj[k==='chapters'?'title':'name']=k==='chapters'?'Untitled Chapter':'New '+({characters:'Character',locations:'Location',lore:'Lore Entry'}[k]);db[k].push(obj);selected[k]=id;save();render();setTimeout(()=>document.querySelector('[data-field]')?.focus(),0)}function renderCollection(k){const entries=db[k],active=entries.find(x=>x.id===selected[k])||entries[0];if(active)selected[k]=active.id;const noun={chapters:'chapter',characters:'character',locations:'location',lore:'lore entry'}[k];$('content').innerHTML=`<p class="intro">${{chapters:'Your manuscript, chapter by chapter.',characters:'The people who inhabit your world.',locations:'Chart the places, kingdoms, and forgotten corners of your realm.',lore:'Keep the history, mysteries, factions, and rules of your universe.'}[k]}</p><div class="layout"><aside class="listpane"><div class="pane-head">${esc(noun)}s <button class="btn primary" id="addBtn" aria-label="Add ${noun}">＋</button></div>${entries.map(x=>`<button class="item ${active?.id===x.id?'selected':''}" data-id="${esc(x.id)}">${esc(labelFor(x))}<small>${esc(x.role||x.region||x.category||(k==='chapters'?countWords(x.body||'')+' words':'Archive entry'))}</small></button>`).join('')}</aside><section class="editor">${active?`<div class="editorhead"><h2>${esc(labelFor(active))}</h2><span class="status" id="saveStatus">All changes saved</span></div><div class="ornament">✦ ─ ✧ ─ ✦</div>${k==='characters'?'<div class="notice">Character profiles are fully editable. Linked relationships are currently written as text; clickable wiki links are planned for the co-op version.</div>':''}${schemas[k].map(([key,label,type])=>field(key,label,active[key],type)).join('')}<div class="actions"><button class="btn danger" id="deleteBtn">Delete ${esc(noun)}</button>${k==='chapters'?'<button class="btn" id="downloadText">Export chapter .txt</button>':''}</div>`:`<div class="empty">Nothing recorded here yet.<br>Create your first ${esc(noun)} to begin.</div>`}</section></div>`;$('addBtn').onclick=()=>newItem(k);document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected[k]=b.dataset.id;render()});if(!active)return;document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{active[el.dataset.field]=el.value;save();$('saveStatus').textContent='Saved locally';const item=document.querySelector('.item.selected');if(item){item.childNodes[0].textContent=labelFor(active);const sm=item.querySelector('small');if(sm)sm.textContent=active.role||active.region||active.category||(k==='chapters'?countWords(active.body||'')+' words':'Archive entry')} }));$('deleteBtn').onclick=()=>{if(confirm(`Delete "${labelFor(active)}"? This cannot be undone unless you have a backup.`)){db[k]=entries.filter(x=>x.id!==active.id);selected[k]=db[k][0]?.id;save();render()}};if(k==='chapters')$('downloadText').onclick=()=>download((active.title||'chapter').replace(/[^a-z0-9_-]/gi,'_')+'.txt',active.title+'\n\n'+(active.body||''),'text/plain')}function render(){nav();$('pageTitle').textContent=tab==='home'?'The Library':({chapters:'The Manuscripts',characters:'Character Codex',locations:'World Atlas',lore:'Lore Archive'}[tab]);tab==='home'?renderHome():renderCollection(tab)}function download(filename,contents,mime){const blob=new Blob([contents],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('exportBtn').onclick=()=>{download('fantasy-archive-backup.json',JSON.stringify(db,null,2),'application/json');toast('Archive exported')};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!['chapters','characters','locations','lore'].every(k=>Array.isArray(parsed[k])))throw Error('Invalid archive format');if(!confirm('Import this archive? It will replace all current local entries. Export a backup first if needed.'))return;db=parsed;for(const k of ['chapters','characters','locations','lore'])selected[k]=db[k][0]?.id;tab='home';save();render();toast('Archive imported')}catch(err){alert('Could not import archive: '+err.message)}finally{e.target.value=''}};render()})();
</script><script>
/* Non-destructive enhancements: existing local archive format is unchanged. */
(()=>{'use strict';
let focus=false,query='';
const content=document.getElementById('content');
const escapeHTML=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base=()=>document.getElementById('pageTitle')?.textContent||'';
function enhance(){
 const title=base(), collection=/Manuscripts|Codex|Atlas|Lore Archive/.test(title);
 if(!collection){document.body.classList.remove('archive-focus');focus=false;query='';return}
 const pane=content.querySelector('.listpane'),editor=content.querySelector('.editor');if(!pane||!editor)return;
 if(!content.querySelector('.archive-tools')){
  const tools=document.createElement('div');tools.className='archive-tools';
  tools.innerHTML='<input class="archive-search" type="search" aria-label="Search entries" placeholder="Search this archive…" value="'+escapeHTML(query)+'"><button type="button" class="btn" id="archiveFocus">'+(focus?'✕ Exit focus':'⛶ Focus mode')+'</button>';
  content.insertBefore(tools,content.querySelector('.layout'));
  const input=tools.querySelector('input');input.addEventListener('input',()=>{query=input.value.toLowerCase();filter(pane)});
  tools.querySelector('#archiveFocus').addEventListener('click',()=>{focus=!focus;document.body.classList.toggle('archive-focus',focus);tools.querySelector('#archiveFocus').textContent=focus?'✕ Exit focus':'⛶ Focus mode'});
 }
 filter(pane);
 if(title==='The Manuscripts'&&!editor.querySelector('.archive-meta')){
  const meta=document.createElement('div');meta.className='archive-meta';meta.setAttribute('aria-live','polite');
  const body=editor.querySelector('[data-field="body"]');
  if(body){const update=()=>{const words=(body.value.trim().match(/\S+/g)||[]).length;meta.textContent=words.toLocaleString()+' words · '+Math.max(1,Math.ceil(words/220))+' min read'};
  body.parentElement.insertAdjacentElement('afterend',meta);body.addEventListener('input',update);update();}
 }
 document.body.classList.toggle('archive-focus',focus);
}
function filter(pane){pane.querySelectorAll('.item').forEach(item=>{item.style.display=item.textContent.toLowerCase().includes(query)?'':'none'})}
const observer=new MutationObserver(()=>{if(!document.getElementById('pageTitle'))return;observer.disconnect();enhance();observer.observe(document.getElementById('content'),{childList:true})});
observer.observe(content,{childList:true});enhance();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&focus){focus=false;document.body.classList.remove('archive-focus');const b=document.getElementById('archiveFocus');if(b)b.textContent='⛶ Focus mode'}});
})();
</script><script src="./cloud.js?v=20261102-chapter-list-repair" defer></script></body></html>
